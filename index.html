<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Komunitas WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 15px auto;
            text-decoration: none;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-grup { background-color: #25D366; }
        .btn-saluran { background-color: #075E54; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h1>Selamat Datang!</h1>
    <p>Pilih salah satu akses di bawah ini:</p>
    
    <!-- Ganti link di bawah dengan link undangan WhatsApp kamu -->
    <a href="https://chat.whatsapp.com/G5o4i1nPf78966Ufc7t3Hx">Masuk Grup WhatsApp</a>
    <a href="https://whatsapp.com/channel/0029VakLbYAJkK7IhtrAxv1l" class="btn btn-saluran">Ikuti Saluran WhatsApp</a>
</div>

</body>
</html>
